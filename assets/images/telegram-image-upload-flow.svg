<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1090" viewBox="0 0 1200 1090" role="img" aria-labelledby="title description">
  <title id="title">Telegram image upload flow</title>
  <desc id="description">A flowchart showing an activity screenshot being received by OpenClaw, imported by Groundhog, stored in DuckDB, and replied to immediately. A separate outbox path delivers stock alerts and job failures.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/></marker>
    <style>
      .box { fill: #ffffff; stroke: #374151; stroke-width: 2.5; rx: 14; }
      .accent { fill: #e0f2fe; stroke: #0369a1; }
      .outbox { fill: #f3e8ff; stroke: #7e22ce; }
      .label { fill: #111827; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 25px; font-weight: 600; text-anchor: middle; }
      .small { fill: #374151; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 20px; text-anchor: middle; }
      .heading { fill: #111827; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 30px; font-weight: 700; }
      .arrow { stroke: #374151; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .outarrow { stroke: #7e22ce; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <text x="60" y="58" class="heading">Import path: tied to one image</text>
  <rect class="box" x="410" y="90" width="380" height="100"/>
  <text class="label" x="600" y="132">User sends an activity screenshot</text><text class="small" x="600" y="163">in Telegram</text>
  <path class="arrow" d="M600 190 V245"/>
  <rect class="box" x="410" y="245" width="380" height="100"/>
  <text class="label" x="600" y="287">OpenClaw receives the image</text><text class="small" x="600" y="318">and starts direct handling</text>
  <path class="arrow" d="M510 345 V400 H300 V455"/><path class="arrow" d="M690 345 V400 H900 V455"/>
  <rect class="box" x="100" y="455" width="400" height="110"/><text class="label" x="300" y="498">Direct upload handler</text><text class="small" x="300" y="530">immediate path for this image</text>
  <rect class="box" x="700" y="455" width="400" height="110"/><text class="label" x="900" y="498">Media watcher</text><text class="small" x="900" y="530">safety net for unseen uploads</text>
  <path class="arrow" d="M300 565 V620 H510"/><path class="arrow" d="M900 565 V620 H690"/>
  <rect class="box accent" x="410" y="620" width="380" height="110"/><text class="label" x="600" y="663">Groundhog vision importer</text><text class="small" x="600" y="695">local Qwen 3-VL reads the image</text>
  <path class="arrow" d="M600 730 V785"/>
  <rect class="box accent" x="410" y="785" width="380" height="105"/><text class="label" x="600" y="827">DuckDB activity record</text><text class="small" x="600" y="858">plus an audit event</text>
  <path class="arrow" d="M410 840 H210 V950"/>
  <rect class="box accent" x="60" y="950" width="300" height="100"/><text class="label" x="210" y="992">Immediate reply</text><text class="small" x="210" y="1023">metrics from this image</text>
  <text x="815" y="800" class="heading">Background alerts only</text>
  <rect class="box outbox" x="820" y="835" width="320" height="80"/><text class="label" x="980" y="883">Stock alert or job failure</text>
  <path class="outarrow" d="M980 915 V950"/>
  <rect class="box outbox" x="820" y="950" width="320" height="100"/><text class="label" x="980" y="992">Outbox → Telegram</text><text class="small" x="980" y="1023">not tied to an image reply</text>
</svg>
